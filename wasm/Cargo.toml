[package]
name = "penux-scorer"
version = "0.1.0"
edition = "2021"
description = "Browser-side deterioration scoring for PenuX-II"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[profile.release]
# Bundle size is on the critical path: the model ships to every browser that
# scores a patient, so size is traded for a small amount of speed.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
