[package]
name = "penux-scorer"
version = "0.1.0"
edition = "2021"
description = "Browser-side deterioration scoring for PenuX-II"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# wasm-bindgen emits a JS glue file; the single-page build uses the raw ABI
# instead so the whole app fits in one HTML document.
bindgen = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = { version = "0.6", optional = true }


[profile.release]
# Bundle size is on the critical path: the model ships to every browser that
# scores a patient, so size is traded for a small amount of speed.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
